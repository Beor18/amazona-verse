# Une con main, al momento, cada subida de la Mac a su rama de paso api-* (subir.sh sube ahí cuando main se movió).
# Así no hace falta abrir PR. Si choca con main, no toca nada: lo une publicar_mac.sh en su próxima vuelta.
name: Unir rama de la API con main
on:
  push:
    branches: ['api-*', '!api-spider']
permissions:
  contents: write
concurrency:
  group: unir-main
  cancel-in-progress: false
jobs:
  unir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unir con main
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$RAMA"
          if git merge-base --is-ancestor "origin/$RAMA" HEAD; then echo "Nada nuevo en $RAMA"; exit 0; fi
          if ! git merge --no-edit -m "Une $RAMA con main" "origin/$RAMA"; then
            git merge --abort
            echo "::warning::$RAMA choca con main; lo une publicar_mac.sh en su próxima vuelta"
            exit 0
          fi
          for i in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main && git merge --no-edit origin/main || { git merge --abort; exit 0; }
          done
          exit 1
