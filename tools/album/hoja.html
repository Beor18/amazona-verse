<!doctype html><html lang="es"><head><base href="/"><meta charset="utf-8">
<!-- Hoja de contacto del Álbum de las 36: la sección real del Diario (html() de src/game/album.js, con sus retratos de
     assets/retratos_album/) y el CSS real (src/ui/tokens.css, ui.css y el ESTILO de album.js). Uso: tools/album/hoja.js -->
<link rel="stylesheet" href="src/ui/tokens.css"><link rel="stylesheet" href="src/ui/ui.css">
<style>
  html,body{margin:0;background:var(--c-paper,#fbf1dc)}
  #card{position:static!important;display:block!important;width:var(--ancho,1000px)!important;max-width:none!important;height:auto!important;max-height:none!important;overflow:visible!important;margin:0!important;transform:none!important;opacity:1!important;visibility:visible!important}
  #card .album36{grid-template-columns:repeat(var(--cols,6),1fr)}
</style></head><body>
<div id="card"><ul class="diary" hidden></ul><div id="sec"></div></div>
<script src="content/comun/especies.js"></script>
<script>
// album.js real sobre un G mínimo (sin juego): su html() da el marcado de la sección.
let SEC = null; const S = { album: [] };
window.AVE = { module: (n, f) => f(G) };
const G = { S, guardado: { KEYS: ['album'] }, diario: { seccion: s => (SEC = s) }, on() {}, emit() {}, quiet: true };
</script>
<script src="src/game/album.js"></script>
<script>
// ids: las especies vistas (las extintas, si están, salen ya reveladas como Mara y Vela). Las demás, cerradas (silueta).
window.montar = function (ids) {
  S.album = ids.slice();
  document.getElementById('sec').innerHTML = SEC.html();
  for (const i of document.images) i.loading = 'eager';
  return Promise.all([...document.images].map(i => i.decode().catch(() => { throw new Error('no carga ' + i.src); })));
};
</script></body></html>
