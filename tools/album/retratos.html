<!doctype html><html><head><base href="/"><meta charset="utf-8"></head><body style="margin:0;background:#777">
<!-- Retratos del Álbum de las 36: el modelo real de Vittata (character.js) con la piel de cada especie (pieles.js), look
     vibrant_toon (src/game/look.js) + luz de 3 puntos, sobre un fondo de su región. Lo maneja tools/album/retratos.js. -->
<script src="assets/vendor/three/build/three.min.js"></script>
<script src="assets/vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="assets/vendor/meshopt/meshopt_decoder.js"></script>
<script src="assets/vendor/three/examples/js/utils/SkeletonUtils.js"></script>
<script src="src/engine/core.js"></script>
<script src="src/engine/assets.js"></script>
<script src="content/comun/especies.js"></script>
<script src="src/personaje/wardrobe.js"></script>
<script src="src/personaje/character.js"></script>
<script src="src/personaje/pieles.js"></script>
<script src="src/game/look.js"></script>
<script src="tools/album/fondos.js"></script>
<script>
'use strict';
let R = null;
async function rig() {
  if (R) return R;
  const canvas = document.createElement('canvas'); document.body.appendChild(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const hemi = new THREE.HemisphereLight('#ffe9c4', '#1f3a2c', 0.8); scene.add(hemi);
  const key = new THREE.DirectionalLight('#ffd9a0', 1.1); scene.add(key);   // clave
  const fill = new THREE.DirectionalLight('#cfe3ff', 0.3); scene.add(fill); // relleno
  const rim = new THREE.DirectionalLight('#ffffff', 1.0); scene.add(rim);   // contraluz (recorte)
  const camera = new THREE.PerspectiveCamera(22, 0.8, 0.01, 100);
  const ch = await AVCharacter.create(); scene.add(ch.root);
  // el look del juego: el código real de look.js sobre un G mínimo (como tools/pieles/render.html)
  const G = { renderer: { renderer, hemi, sun: key, scene, calidad: { nivel: 'alto', texMax: 0 } }, pack: { mundo: { exposicion: 0.74, luces: { cielo: '#cfe6ff', suelo: '#45602e', hemi: 0.66, sol: '#fff0d6', solInt: 2.0, solPos: [-42, 70, 46] } } }, util: { $: () => null }, emit() {}, on() {} };
  const LOOK = window.AVLook(G); LOOK.aplicar('vibrant_toon');
  R = { canvas, renderer, scene, camera, ch, key, fill, rim, hemi }; return R;
}
const dir = (v, yaw) => new THREE.Vector3(...v).normalize().multiplyScalar(10);

// Render 3D del ave (transparente) a w×h. o: piel, pose, t, yaw, encuadre {tf, alto, cx}, luces
async function ave(o, w, h) {
  const { canvas, renderer, scene, camera, ch } = await rig();
  renderer.setSize(w, h, false);
  await AVCharacter.preloadRopa();
  ch.applyLook(AVCharacter.normalizeLook({ species: 'vittata', accessories: {} }));
  if (o.piel) await AVE.pieles.aplicar(ch, o.piel);
  await AVE.pieles.listo(ch);
  ch.mixer.stopAllAction();
  const clip = ch.clips[o.pose || 'Idle'] || ch.clips.Idle;
  ch.mixer.clipAction(clip).reset().play(); ch.mixer.setTime(clip.duration * (o.t == null ? 0.3 : o.t));
  ch.clothes();
  ch.root.rotation.set(0, o.yaw || 0, 0); ch.root.updateMatrixWorld(true);
  // caja medida en la pose sin girar (mismo modelo y misma pose en las 36 → mismo encuadre); se guarda la primera
  if (!R.caja) { ch.root.rotation.set(0, 0, 0); ch.root.updateMatrixWorld(true); R.caja = new THREE.Box3().setFromObject(ch.root); ch.root.rotation.set(0, o.yaw || 0, 0); ch.root.updateMatrixWorld(true); }
  const box = R.caja, H = box.max.y - box.min.y; window.CAJA = [box.min.toArray(), box.max.toArray()];
  const E = o.encuadre;
  const tgt = new THREE.Vector3(E.tx || 0, box.min.y + H * E.tf, (box.min.z + box.max.z) / 2);
  camera.fov = E.fov; camera.aspect = w / h; camera.updateProjectionMatrix();
  const dist = (H * E.alto / 2) / Math.tan(THREE.MathUtils.degToRad(E.fov / 2));          // alto visible = E.alto × alto del ave
  camera.position.set(tgt.x + dist * Math.sin(E.az || 0), tgt.y + dist * Math.sin(E.el || 0), tgt.z + dist * Math.cos(E.az || 0));
  camera.lookAt(tgt);
  // luz de 3 puntos (sobre la del look: clave cálida, relleno frío y suave, contraluz blanco desde atrás)
  const L = o.luces;
  R.key.position.copy(dir(L.key)); R.key.intensity = L.keyI; R.key.color.set(L.keyC);
  R.fill.position.copy(dir(L.fill)); R.fill.intensity = L.fillI; R.fill.color.set(L.fillC);
  R.rim.position.copy(dir(L.rim)); R.rim.intensity = L.rimI; R.rim.color.set(L.rimC);
  R.hemi.intensity = L.hemiI; renderer.toneMappingExposure = L.exp;
  renderer.render(scene, camera);
  return canvas;
}

function encode(cv, type, maxKB, q0) {
  let q = q0, url;
  for (; q >= 0.4; q -= 0.04) { url = cv.toDataURL(type, q); if (url.length * 0.75 / 1024 <= maxKB) break; }
  return { url, q: +q.toFixed(2), kb: +(url.length * 0.75 / 1024).toFixed(1) };
}
function reducir(src, w, h) { // reducción por pasos de ½ (más nítida que un solo drawImage)
  let c = src;
  while (c.width / 2 >= w) { const n = document.createElement('canvas'); n.width = c.width / 2; n.height = c.height / 2; const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, n.width, n.height); c = n; }
  if (c.width !== w) { const n = document.createElement('canvas'); n.width = w; n.height = h; const x = n.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, w, h); c = n; }
  return c;
}

// Tarjeta completa: fondo de la región + ave + acabado. Devuelve @2x y 1x codificadas.
window.retrato = async function (o) {
  const W = o.w2 || 512, Hh = o.h2 || 640, SS = o.ss || 2;
  const a = await ave(o, W * SS, Hh * SS);
  const cv = document.createElement('canvas'); cv.width = W * SS; cv.height = Hh * SS; const x = cv.getContext('2d');
  AVFondos.pintar(x, cv.width, cv.height, o.region, o.acento, o.semilla || 1);
  AVFondos.sombra(x, a, cv.width, cv.height);           // sombra suave del ave sobre el fondo (despega la figura)
  x.drawImage(a, 0, 0);
  AVFondos.acabado(x, cv.width, cv.height);              // viñeta y grano fino
  const c2 = reducir(cv, W, Hh), c1 = reducir(c2, W / 2, Hh / 2);
  const t = o.formato === 'jpg' ? 'image/jpeg' : 'image/webp';
  return { x2: encode(c2, t, o.maxKB2 || 60, 0.94), x1: encode(c1, t, o.maxKB1 || 25, 0.94) };
};
// Silueta de las tarjetas cerradas: la misma ave, en la misma pose y encuadre, rellena de un gris liso sobre papel claro.
// Es igual para las 36 (mismo modelo, misma pose), así que no delata la especie. Sin texto.
window.silueta = async function (o) {
  const W = o.w2 || 512, Hh = o.h2 || 640, SS = o.ss || 2;
  const a = await ave(o, W * SS, Hh * SS);
  const cv = document.createElement('canvas'); cv.width = W * SS; cv.height = Hh * SS; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, '#eee9df'); g.addColorStop(1, '#d9d2c4');
  x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.height);
  const h = x.createRadialGradient(cv.width * 0.5, cv.height * 0.34, 0, cv.width * 0.5, cv.height * 0.34, cv.width * 0.62);
  h.addColorStop(0, 'rgba(255,255,255,.55)'); h.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = h; x.fillRect(0, 0, cv.width, cv.height);
  const m = document.createElement('canvas'); m.width = cv.width; m.height = cv.height; const y = m.getContext('2d');
  y.drawImage(a, 0, 0); y.globalCompositeOperation = 'source-in';
  const f = y.createLinearGradient(0, 0, 0, cv.height); f.addColorStop(0, '#9a9fa4'); f.addColorStop(1, '#7c8186'); // #8a8f94 de media
  y.fillStyle = f; y.fillRect(0, 0, cv.width, cv.height);
  x.drawImage(m, 0, 0);
  AVFondos.acabado(x, cv.width, cv.height);
  const c2 = reducir(cv, W, Hh), c1 = reducir(c2, W / 2, Hh / 2);
  return { x2: encode(c2, 'image/webp', o.maxKB2 || 60, 0.94), x1: encode(c1, 'image/webp', o.maxKB1 || 25, 0.94) };
};
window.READY = true;
</script></body></html>
