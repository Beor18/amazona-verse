<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#10241c}
.card{position:relative;width:1200px;height:630px;background:url(fondo.jpg) center/cover}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,36,28,.55) 0%,rgba(16,36,28,.15) 45%,rgba(16,36,28,0) 60%,rgba(16,36,28,.55) 100%)}
.logo{position:absolute;left:300px;top:22px;width:600px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.logo svg{width:100%;height:auto;overflow:visible}
.lema{position:absolute;left:0;right:0;top:292px;text-align:center;font:700 54px/1.1 Fredoka,'Trebuchet MS',sans-serif;color:#fff;text-shadow:0 3px 0 #1d5e33,0 6px 22px rgba(0,0,0,.6)}
.lema b{color:#ffcb3d}
.pie{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:12px;white-space:nowrap;font:600 23px Fredoka,'Trebuchet MS',sans-serif;color:#10241c}
.pie span{background:#fff6e0;border-radius:999px;padding:6px 20px;box-shadow:0 4px 0 #8a5a2b}
.pie .verde{background:#a6ea72;box-shadow:0 4px 0 #3f9a55}
</style></head><body><div class="card">
<div class="logo">      <svg viewBox="0 0 640 260" role="img" aria-label="Amazona Verse">
        <defs>
          <linearGradient id="lg-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8cf"/><stop offset=".45" stop-color="#ffcb3d"/><stop offset="1" stop-color="#ee7a12"/></linearGradient>
          <linearGradient id="lg-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="lg-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6ea72"/><stop offset="1" stop-color="#23824a"/></linearGradient>
          <linearGradient id="lg-ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0604f"/><stop offset="1" stop-color="#b52f2a"/></linearGradient>
          <clipPath id="clip-word"><text x="320" y="160" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="128" textLength="570" lengthAdjust="spacingAndGlyphs">AMAZONA</text></clipPath>
        </defs>
        <g class="logo-leaves">
          <path d="M70 120C40 80 50 30 96 6c6 44-4 84-26 114z" fill="url(#lg-leaf)" stroke="#1d5e33" stroke-width="5" stroke-linejoin="round"/>
          <path d="M70 120C78 80 84 44 96 6" fill="none" stroke="#1d5e33" stroke-width="4" stroke-linecap="round"/>
          <path d="M84 126C58 104 30 98 4 108c26 26 56 30 80 18z" fill="url(#lg-leaf)" stroke="#1d5e33" stroke-width="5" stroke-linejoin="round"/>
          <path d="M568 112c34-34 34-82-4-112-14 40-12 80 4 112z" fill="url(#lg-leaf)" stroke="#1d5e33" stroke-width="5" stroke-linejoin="round"/>
          <path d="M568 112C566 74 566 38 564 0" fill="none" stroke="#1d5e33" stroke-width="4" stroke-linecap="round"/>
          <path d="M556 124c28-24 58-28 82-14-28 24-58 26-82 14z" fill="url(#lg-leaf)" stroke="#1d5e33" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="128" text-anchor="middle">
          <text x="320" y="168" fill="#2b1405" stroke="#2b1405" stroke-width="26" stroke-linejoin="round" textLength="570" lengthAdjust="spacingAndGlyphs">AMAZONA</text>
          <text x="320" y="160" fill="#4a2408" stroke="#4a2408" stroke-width="18" stroke-linejoin="round" textLength="570" lengthAdjust="spacingAndGlyphs">AMAZONA</text>
          <text x="320" y="160" fill="url(#lg-gold)" textLength="570" lengthAdjust="spacingAndGlyphs">AMAZONA</text>
        </g>
        <g clip-path="url(#clip-word)"><polygon class="logo-shine" points="0,40 60,40 20,180 -40,180" fill="url(#lg-shine)"/></g>
        <path d="M206 196h-48l16 22-16 22h62z" fill="#8e2420"/>
        <path d="M434 196h48l-16 22 16 22h-62z" fill="#8e2420"/>
        <path d="M200 180q120-18 240 0v50q-120-18-240 0z" fill="url(#lg-ribbon)" stroke="#5e1512" stroke-width="5" stroke-linejoin="round"/>
        <circle cx="158" cy="240" r="8" fill="#ffd27a" stroke="#8a5a2b" stroke-width="3"/>
        <circle cx="482" cy="240" r="8" fill="#ffd27a" stroke="#8a5a2b" stroke-width="3"/>
        <text x="320" y="219" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" font-size="38" letter-spacing="12" fill="#fff6e0" stroke="#5e1512" stroke-width="6" stroke-linejoin="round" paint-order="stroke">VERSE</text>
      </svg></div>
<div class="lema">Aprende ciencia <b>volando</b> con Vittata</div>
<div class="pie"><span class="verde">▶ Juega gratis en el navegador</span><span>Grados 3 a 6</span><span>Hecho en Puerto Rico</span></div>
</div></body></html>
